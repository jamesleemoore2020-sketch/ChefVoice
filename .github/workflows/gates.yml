# Every ChefVoice gate, on every push and pull request.
#
# Until this existed the gates ran only as RUN_*_GATES.cmd on one Windows PC, so the
# golden-corpus contract -- both parsers must pass every row before either ships -- and
# the rules gate were enforced by memory. A parser change pushed from a cloud session
# never ran the Kotlin half. These jobs run the same commands the .cmd scripts run.
#
# Nothing here deploys or talks to the production Firebase project. The rules job runs
# against the local Firestore emulator under a throwaway project id.

name: Gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa:
    name: PWA tests (JS parser + golden corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # RUN_PARSER_GATES.cmd step 1. Includes web/tests/golden-corpus.test.mjs, the JS half
      # of shared/golden-cooking-corpus.tsv.
      - name: npm test
        working-directory: web
        run: npm test
      # The three jsdom checks were optional and manual, and two of them had silently broken
      # at HEAD before session 8 repaired them. jsdom is installed outside web/ so the PWA
      # keeps its no-dependency, no-build-step shape.
      - name: DOM integration checks (jsdom)
        working-directory: web
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/domdeps" jsdom
          for check in tests/*.dom.mjs; do
            echo "::group::$check"
            COOK_TEST_MODULES="$RUNNER_TEMP/domdeps/node_modules" node "$check"
            echo "::endgroup::"
          done

  e2e:
    name: PWA in a browser (Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: npm ci
        working-directory: e2e
        run: npm ci
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      # Every request that leaves the local server is refused (e2e/fixtures.mjs), so this
      # can never read from or write to the production project.
      - name: Playwright
        working-directory: e2e
        run: npx playwright test
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  functions:
    name: Functions gates (notifications, billing, import, share)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: import/functions/package-lock.json
      # RUN_NOTIFICATION_GATES.cmd. Globbed rather than listed, so a new gate file cannot be
      # written and then never run.
      - name: Notification gates
        run: node --test "notifications/*.test.js" "notifications/functions/*.test.js"
      - name: Notification function syntax
        run: node --check notifications/functions/index.js
      # RUN_BILLING_GATES.cmd
      - name: Billing gates
        run: node --test "billing/*.test.js"
      - name: Billing function syntax
        run: node --check billing/functions/index.js
      # The importer's fetch tests open real sockets through undici (page-fetcher.js), so the
      # codebase's own dependencies come first, from its lock file.
      - name: Import dependencies
        working-directory: import/functions
        run: npm ci
      # RUN_IMPORT_GATES.cmd. `node --test import/functions` would load index.js and initialise
      # the Admin SDK, which is why the glob names only the test files.
      - name: Import gates
        run: node --test "import/functions/*.test.js"
      - name: Import function syntax
        run: node --check import/functions/index.js
      # RUN_SHARE_GATES.cmd. The page behind a shared recipe link is pure functions, so these
      # need no dependencies.
      - name: Share-link gates
        run: node --test "share/functions/*.test.js"
      - name: Share function syntax
        run: node --check share/functions/index.js

  android:
    name: Android unit tests (Kotlin parser + golden corpus)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # gradlew downloads a pinned, SHA-256-checked Gradle into ~/.chefvoice/gradle.
      # Robolectric fetches its Android runtime (about 200 MB) into ~/.m2 on first use.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.chefvoice/gradle
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('gradlew', '*.gradle.kts', 'app/build.gradle.kts', 'gradle.properties', 'app/src/test/resources/robolectric.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      # RUN_PARSER_GATES.cmd step 2. Includes GoldenCookingCorpusTest, the Kotlin half of the
      # shared corpus, and the Robolectric UI tests in app/src/test/.../ui (bottom-bar
      # navigation, what TalkBack is told). No signing variables are set, and none are needed
      # for a debug test run.
      - name: gradlew :app:testDebugUnitTest
        run: bash ./gradlew :app:testDebugUnitTest --console=plain
      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            rules-tests/package-lock.json
            notifications/functions/package-lock.json
      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('rules-tests/package-lock.json') }}
      # RUN_RULES_GATES.cmd. `npm test` runs firebase emulators:exec from the pinned
      # firebase-tools devDependency; the emulator reads firestore.rules through the root
      # firebase.json, so this is the rules file that would be deployed.
      - name: npm ci
        working-directory: rules-tests
        run: npm ci
      # deletion-backfill.test.js runs a notifications callable against the emulator, so that
      # codebase's own dependencies come from its lock file too.
      - name: Notification function dependencies
        working-directory: notifications/functions
        run: npm ci
      - name: npm test
        working-directory: rules-tests
        run: npm test
