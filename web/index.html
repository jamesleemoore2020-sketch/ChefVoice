<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f06423" media="(prefers-color-scheme: light)" data-scheme="light">
  <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" data-scheme="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ChefVoice">
  <link rel="apple-touch-icon" href="assets/chefvoice-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Blocking and first: puts the chef's Light or Blackout choice on <html> before the page
       is drawn, so a device in the other theme never flashes. -->
  <script src="js/theme-boot.js"></script>
  <title>ChefVoice</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand"><img src="assets/chefvoice-icon.png" alt=""><div><strong>ChefVoice</strong><small>Cook it. Say it. Save it.</small></div></div>
      <span id="modeBadge" class="badge">PWA 0.5.21</span>
    </header>

    <main id="main" class="main"></main>
    <!-- Status announcements for screen readers. <main> is rebuilt on every render, so a
         live region there re-read the whole screen, every transcript line included. -->
    <div id="srStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-tab="cook" class="active"><span>🎙</span>Cook</button>
      <button data-tab="recipes"><span>🍳</span>Recipes</button>
      <button data-tab="community"><span>👥</span>Community</button>
      <button data-tab="inbox"><span>💬</span>Inbox<span id="inboxBadge" class="nav-badge" hidden></span></button>
      <button data-tab="live"><span>📡</span>Live</button>
      <button data-tab="profile"><span>👤</span>Profile</button>
    </nav>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
